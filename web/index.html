<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EarthTwin · Team PLANEX</title>
  <meta name="description" content="Find Earth places that analog NASA's next Moon and Mars target sites. NASA Space Apps 2026, Team PLANEX.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://trek.nasa.gov https://gibs.earthdata.nasa.gov https://planetarymaps.usgs.gov; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/space.css">
</head>
<body>
  <header class="nav" id="nav">
    <a class="nav-brand" href="#home" data-route="home">EarthTwin</a>
    <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-links" aria-label="Open menu"><span></span><span></span><span></span></button>
    <nav class="nav-links" id="nav-links" aria-label="Main">
      <a class="nav-item nav-stack" href="#moon-analog" data-route="moon-analog"><span class="nav-label">Moon</span><span class="nav-sub">Analog</span></a>
      <a class="nav-item nav-stack" href="#mars-analog" data-route="mars-analog"><span class="nav-label">Mars</span><span class="nav-sub">Analog</span></a>
      <a class="nav-item" href="#why-not-others" data-route="why-not-others">Why Not Others</a>
      <a class="nav-item" href="#method" data-route="method">Method</a>
      <a class="nav-item" href="#limitations" data-route="limitations">Limitations</a>
      <a class="nav-item" href="#sources" data-route="sources">Sources</a>
      <a class="nav-item" href="#planex" data-route="planex">PLANEX</a>
    </nav>
    <span class="badge sample" id="sample-badge" hidden data-tip="Some Earth values are still placeholders until the team adds real data.">Partly sample data</span>
  </header>

  <main>
    <section class="view view-home" id="view-home" aria-label="Solar system">
      <canvas id="solar" aria-label="Animated solar system. Select the Moon or Mars to explore Earth analogs."></canvas>
      <div class="solar-tip" id="solar-tip" hidden>Click to explore</div>
      <p class="solar-hint">Click the Moon or Mars to explore</p>
      <div class="sr-only"><a href="#moon-analog">Explore Moon analogs (Artemis)</a> <a href="#mars-analog">Explore Mars analogs (SkyFall)</a></div>
    </section>

    <section class="view" id="view-analogs" aria-label="Analogs">
      <div class="mapwrap">
        <div class="map" id="map-target"></div>
        <div class="maphead">
          <div><div class="label" id="target-kicker">Target</div><div class="title" id="target-title">—</div></div>
          <div class="layerstate" id="target-layerstate"></div>
        </div>
      </div>
      <div class="mapwrap">
        <div class="map" id="map-earth"></div>
        <div class="maphead">
          <div><div class="label">Earth</div><div class="title" id="earth-title">Analog candidates</div></div>
          <div class="layerstate" id="earth-layerstate"></div>
        </div>
      </div>
      <aside class="side" id="side" aria-label="Results"></aside>
    </section>

    <section class="view" id="view-why" aria-label="Why not others"><div class="page" id="page-why"></div></section>
    <section class="view" id="view-method" aria-label="Method"><div class="page" id="page-method"></div></section>
    <section class="view" id="view-limits" aria-label="Limitations"><div class="page" id="page-limits"></div></section>
    <section class="view" id="view-sources" aria-label="Sources"><div class="page" id="page-sources"></div></section>
    <section class="view" id="view-planex" aria-label="PLANEX"><div class="page" id="page-planex"></div></section>
  </main>

  <div id="tip" role="tooltip"></div>
  <noscript><p style="padding:80px 24px">EarthTwin needs JavaScript. Serve this folder with <code>python3 -m http.server</code>.</p></noscript>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/util.js"></script>
  <script src="js/layers.js"></script>
  <script src="js/tiles-check.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/solar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
