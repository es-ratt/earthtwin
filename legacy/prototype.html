<canvas id="gx" aria-hidden="true"></canvas><noscript><p style="padding:24px;color:#fff">EarthTwin needs JavaScript. It is a frontend demonstration using illustrative data.</p></noscript>
<nav><div class="brand" data-a="go" data-v="/">Earth<b>Twin</b></div><button id="burger" class="btn sec" data-a="menu" aria-label="Toggle navigation" aria-expanded="false">☰ Menu</button><div class="links" id="links"></div><button id="theme" class="btn sec" aria-label="Switch between light and dark mode"></button></nav>

<script>
try{
const $=s=>document.querySelector(s),cl=v=>Math.max(0,Math.min(100,v)),sum=a=>a.reduce((x,y)=>x+y,0);
const FL=['Terrain','Geology','Environment','Resources'];
const PRE={general:{n:'General Analog',w:[25,20,25,30]},rover:{n:'Rover Testing',w:[40,30,20,10]},ice:{n:'Ice Drill Testing',w:[15,15,25,45]},habitat:{n:'Habitat Materials',w:[20,45,25,10]}};
const MIS={base:{n:'Permanent Base',i:'🏗️',d:'Long-term habitat siting and resource access.',p:'ice'},land:{n:'Landing Site',i:'🛬',d:'Safe, flat, well-characterized touchdown terrain.',p:'rover'},rover:{n:'Rover Testing',i:'🛞',d:'Mobility over realistic slopes and regolith.',p:'rover'},res:{n:'Research Mission',i:'🔬',d:'Broad geology and environment science.',p:'general'}};
const S=[['antarctica-dry-valleys','Antarctic Dry Valleys','Antarctica',-77.5,161,[80,72,90,70],[86,80,92,78],88,.8,.5,1,'Hyper-arid, ice-cemented cold desert with polar soils.',['Extreme cold and aridity','Buried ground ice','Polar logistics experience'],'Very remote; costly access.',['Ice-drill trials','Cold-soil studies']],
['atacama','Atacama Desert','Chile',-24.5,-69.25,[70,60,55,40],[88,85,80,55],85,.1,.3,.2,'Hyper-arid plateau with oxidized, salt-rich soils.',['Dust and soil chemistry','Rover-friendly terrain','Accessible'],'Warm; little ice.',['Rover testing','Soil chemistry']],
['iceland-volcanic','Icelandic Volcanic Fields','Iceland',64.9,-19,[78,88,60,65],[75,90,62,60],84,.6,1,.5,'Fresh basaltic fields with glacial and volcanic interaction.',['Basalt geology','Ice-volcano interaction','Easy access'],'Wet, vegetated, and mild in places.',['Habitat material studies','Geology surveys']],
['hawaii-basalt','Hawaiian Basalt Fields','USA (Hawaii)',19.5,-155.5,[85,92,50,70],[80,88,45,55],82,.1,1,.2,'Well-studied basalt flows used for long-running field analog work.',['Basaltic regolith','Mature infrastructure','Terrain variety'],'Warm and humid; no cold-trap conditions.',['ISRU regolith trials','Rover mobility']],
['utah-desert','Utah High Desert','USA (Utah)',38.4,-110.8,[68,60,50,35],[82,78,72,50],80,.05,.4,.4,'Layered sedimentary desert with mesas and dry washes.',['Sedimentary stratigraphy','Very accessible','Habitat simulation heritage'],'Limited ice and cold.',['Habitat simulation','Crew operations']],
['arctic-permafrost','High Arctic Permafrost','Canada (Nunavut)',75.4,-89,[72,66,80,82],[82,72,85,88],86,.9,.4,.9,'Polar desert impact crater terrain with permafrost.',['Ground ice access','Cold environment','Impact geology'],'Short field season.',['Ice-drill trials','Base logistics']],
['canary-volcanic','Canary Volcanic Terrain','Spain (Tenerife)',28.27,-16.64,[74,84,55,45],[72,80,58,42],78,.05,.9,.2,'High-altitude volcanic landscape with basalt and phonolite.',['Volcanic geology','Easy access'],'Mild climate; limited resource match.',['Instrument checkout']],
['namib-gravel','Namib Gravel Plains','Namibia',-24,15.5,[66,55,45,30],[78,70,65,40],75,.05,.3,.3,'Flat gravel plains and dune margins.',['Flat rover terrain','Low vegetation'],'Weak geology and resource match.',['Landing-terrain trials']],
['svalbard','Svalbard Valley Systems','Norway (Svalbard)',78.2,16,[70,64,72,75],[74,68,76,78],83,.75,.4,.85,'Glacial valleys, permafrost and periglacial landforms.',['Permafrost and ice','Cold climate','Research infrastructure'],'Vegetation and frequent snow cover.',['Ice research','Periglacial studies']],
['iceland-tubes','Iceland Lava Tubes','Iceland',64.7,-20.5,[80,85,65,72],[70,78,62,66],81,.6,1,.5,'Basaltic lava tubes with ice-bearing caves.',['Lava-tube habitat analogs','Ice deposits','Basalt'],'Small scale compared to lunar tubes.',['Shelter studies','Cave robotics']],
['craters-idaho','Craters of the Moon','USA (Idaho)',43.4,-113.5,[82,86,55,45],[74,80,50,40],80,.1,1,.4,'Young basalt lava field with cinder cones and lava tubes.',['Fresh basalt flows','Rugged terrain'],'Little ice; temperate.',['Geology training','Rover traverses']],
['danakil','Danakil Depression','Ethiopia',14.2,40.3,[60,75,35,30],[70,88,50,45],72,0,.8,0,'Hot volcanic basin with evaporites and hydrothermal features.',['Mineral diversity','Hydrothermal geology'],'Extreme heat and security constraints.',['Mineral studies']]]
.map(a=>({id:a[0],name:a[1],country:a[2],lat:a[3],lon:a[4],moon:a[5],mars:a[6],c:a[7],ice:a[8],bas:a[9],cold:a[10],desc:a[11],str:a[12],lim:a[13],apps:a[14]}));
const T={moon_sp:{p:'moon',n:'Lunar South Pole',env:'Extreme cold / permanent shadow / illumination variation',wi:1.2,wb:.3,wc:1,m:[['Elevation','−2.5 to +4.5 km',55],['Slope','5–20°',60],['Roughness','High',75],['Temperature','~40–100 K (shadowed)',15],['Illumination','0–90% per year',35],['Ice / Water','Indicated in shadow',80],['Geology','Highland anorthosite',50],['Resource potential','High (volatiles)',85]]},
moon_mare:{p:'moon',n:'Mare Tranquillitatis',env:'Basaltic plain / large day-night thermal swing',wi:.1,wb:1.2,wc:.2,m:[['Elevation','−1.9 km',40],['Slope','<5°',15],['Roughness','Low',25],['Temperature','~100–390 K',55],['Illumination','~50% (14-day cycle)',60],['Ice / Water','Minimal',8],['Geology','Basalt mare',85],['Resource potential','Moderate (ilmenite)',55]]},
mars_lz:{p:'mars',n:'Mars Landing Zone',env:'Dusty basaltic plain / thin CO₂ atmosphere / cold swings',wi:.5,wb:.8,wc:.5,m:[['Elevation','−2.6 km',35],['Slope','<8°',25],['Roughness','Moderate',45],['Temperature','~150–290 K',50],['Illumination','Diurnal + dust storms',65],['Ice / Water','Hydrated minerals',40],['Geology','Basalt + clay/delta deposits',75],['Resource potential','Moderate',50]]},
mars_ice:{p:'mars',n:'Arcadia Planitia (ice plains)',env:'Mid-latitude subsurface ice / cold / smooth plains',wi:1.2,wb:.3,wc:.9,m:[['Elevation','−3.0 km',30],['Slope','<3°',10],['Roughness','Low',20],['Temperature','~150–260 K',30],['Illumination','Seasonal',55],['Ice / Water','Shallow ice indicated',85],['Geology','Volcanic plains + ice',55],['Resource potential','High (water ice)',80]]}};
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const st={planet:'moon',tg:'moon_sp',mis:'base',pre:'ice',w:[15,15,25,45],step:0,scanned:false,scan:-1,sel:null,cmp:[]};
const SC=['Scanning terrain…','Analyzing geology…','Comparing environmental conditions…','Evaluating resource indicators…','Calculating AMI…','Finding candidate analogs…'];
function score(s,t,w){const b=s[t.p],f=[b[0],cl(b[1]+(s.bas-.5)*t.wb*20),cl(b[2]+(s.cold-.5)*t.wc*20),cl(b[3]+(s.ice-.5)*t.wi*24)],m=sum(f)/4,sd=Math.sqrt(sum(f.map(x=>(x-m)**2))/4);
return{...s,f:f.map(Math.round),ami:Math.round(sum(f.map((x,i)=>x*w[i]))/100),conf:Math.round(cl(s.c-sd*.3))}}
const rank=(t=T[st.tg],w=st.w)=>S.map(s=>score(s,t,w)).sort((a,b)=>b.ami-a.ami);
function season(r,t=T[st.tg],w=st.w){const cold=t.wc>=.9;return MO.map((m,i)=>{const sf=Math.cos((i-6)/12*2*Math.PI)*(r.lat>=0?1:-1),amp=.5+Math.abs(r.lat)/90;
const tmp=cl(r.f[2]+(cold?-sf*14*(r.cold>.5?1:.6):sf*8*(1-r.cold))*amp),acc=cl(r.f[0]+sf*10*(r.cold*.8+.2)*amp),env=cl(r.f[2]+(tmp-r.f[2])*.5),ami=cl(r.ami+(tmp-r.f[2])*.25*w[2]/25+(acc-r.f[0])*.25*w[0]/25);
return{m,tmp:Math.round(tmp),acc:Math.round(acc),env:Math.round(env),ami:Math.round(ami)}})}
const win=se=>{let b=0,bv=-1;for(let i=0;i<12;i++){const v=sum([0,1,2].map(k=>se[(i+k)%12].ami))/3;if(v>bv){bv=v;b=i}}return MO[b]+'–'+MO[(b+2)%12]+' (avg '+Math.round(bv)+'%)'};
const stab=se=>Math.round(cl(100-(Math.max(...se.map(x=>x.ami))-Math.min(...se.map(x=>x.ami)))*3));
function explain(r){const t=T[st.tg],w=st.w,o=FL.map((k,i)=>({k,v:r.f[i],w:w[i],c:r.f[i]*w[i]})).sort((a,b)=>b.c-a.c),lo=[...o].sort((a,b)=>a.v-b.v)[0],lv=v=>v>=85?'strong':v>=70?'moderate':'limited';
return `${r.name} scores ${r.ami}% against ${t.n} for a ${MIS[st.mis].n.toLowerCase()} using the “${st.pre==='custom'?'Custom':PRE[st.pre].n}” priorities. ${o[0].k} (${o[0].v}% similarity × ${o[0].w}% weight) and ${o[1].k} (${o[1].v}% × ${o[1].w}%) contribute most, showing ${lv(o[0].v)} and ${lv(o[1].v)} similarity. The weakest factor is ${lo.k} at ${lo.v}%${lo.w>=25?', which matters because you weighted it at '+lo.w+'%':''}. ${t.p==='moon'?'A key limitation: Earth cannot reproduce lunar gravity (1/6 g), hard vacuum or radiation.':'A key limitation: Earth cannot reproduce Martian gravity (0.38 g), the thin CO₂ atmosphere or surface radiation.'} Site-specific note: ${r.lim} Confidence of ${r.conf}% is a demo heuristic combining data completeness and agreement between factors.`}
const bar=p=>`<div class="bar" role="img" aria-label="${Math.round(p)} percent"><i style="width:${p}%"></i></div>`;
const disc='EarthTwin is a frontend demonstration using illustrative data. Results are not scientific mission recommendations and should not be treated as validated NASA analysis. Not affiliated with NASA.';
const D=`<div class="dis">ⓘ ${disc}</div>`;
const site=id=>S.find(s=>s.id===id);
const cand=id=>rank().find(s=>s.id===id);
const route=()=>location.hash.replace(/^#/,'')||'/';
const LK=[['/','Home'],['/setup','Setup'],['/target','Target'],['/results','Earth Scan'],['/compare','Compare'],['/season','Seasons'],['/report','Report']];
function nav(){const r='/'+route().split('/')[1];$('#links').innerHTML=LK.map(l=>`<button data-a="go" data-v="${l[0]}" class="${(r===l[0]||(r==='/site'&&l[0]==='/results'))?'on':''}">${l[1]}</button>`).join('')}
function orbs(){return `<div aria-hidden="true" style="display:flex;gap:14px;align-items:center;margin:14px 0"><span class="orb" style="width:74px;height:74px;background:radial-gradient(circle at 35% 30%,#99f6e4,#0d9488 60%,#134e4a)"></span><span class="orb" style="width:46px;height:46px;background:radial-gradient(circle at 35% 30%,#f2f2f2,#9a9a9a 75%)"></span><span class="orb" style="width:40px;height:40px;background:radial-gradient(circle at 35% 30%,#f5d0fe,#a21caf 70%)"></span></div>`}
function landing(){const a=rank(T.moon_sp,PRE.general.w)[0],b=rank(T.mars_lz,PRE.general.w)[0];
return `<section class="grid split" style="align-items:center"><div><span class="tag">Demonstration data · not NASA</span>${orbs()}<h1>Where on Earth is the Moon and Mars?</h1><p class="mu" style="font-size:1.1rem">Discover Earth environments that resemble selected lunar and Martian mission targets.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn" data-a="explore" data-v="moon">Explore Moon</button><button class="btn" data-a="explore" data-v="mars">Explore Mars</button></div></div>
<div class="card"><h3>Recent analyses <span class="tag">demo</span></h3>
<button class="rk" data-a="quick" data-v="moon_sp"><b>Moon South Pole</b><br><span class="mu sm">Top: ${a.name}</span> <b style="float:right">${a.ami}% AMI</b></button>
<button class="rk" data-a="quick" data-v="mars_lz"><b>Mars Landing Zone</b><br><span class="mu sm">Top: ${b.name}</span> <b style="float:right">${b.ami}% AMI</b></button>
<div class="grid g2" style="margin-top:8px"><div><div class="big">${S.length}</div><span class="mu sm">candidate analogs</span></div><div><div class="big">4</div><span class="mu sm">targets · Moon &amp; Mars</span></div></div><p class="sm mu">Mission status: <span style="color:var(--ok)">● Demo ready</span></p></div></section>
<section class="grid g4" style="margin-top:20px">${['1 · Choose mission &amp; target','2 · Set priorities','3 · Scan Earth (AMI)','4 · Compare &amp; report'].map(x=>`<div class="card sm">${x}</div>`).join('')}</section>${D}`}
function setup(){const n=['Mission','Target','Priorities','Earth Scan','Results'],s=st.step;
let h=`<h2>Mission Setup</h2><div class="steps" role="list">${n.map((x,i)=>`<span role="listitem" class="${i===s?'on':i<s?'done':''}">${i<s?'✓':i+1}. ${x}</span>`).join('')}</div><div class="card">`;
if(s===0)h+=`<h3>What kind of mission?</h3><div class="grid g4" style="margin-top:10px">${Object.entries(MIS).map(([k,m])=>`<button class="opt ${st.mis===k?'sel':''}" data-a="mis" data-v="${k}" aria-pressed="${st.mis===k}"><div style="font-size:1.6rem">${m.i}</div><b>${m.n}</b><div class="mu sm">${m.d}</div></button>`).join('')}</div>`;
if(s===1){const t=T[st.tg];h+=`<h3>Choose a body</h3><div style="display:flex;gap:10px;margin:10px 0">${['moon','mars'].map(p=>`<button class="opt ${st.planet===p?'sel':''}" data-a="planet" data-v="${p}" aria-pressed="${st.planet===p}">${p==='moon'?'🌙 Moon':'🪐 Mars'}</button>`).join('')}</div><div class="grid g2">${Object.entries(T).filter(([k,x])=>x.p===st.planet).map(([k,x])=>`<button class="opt ${st.tg===k?'sel':''}" data-a="tg" data-v="${k}"><b>${x.n}</b><div class="mu sm">${x.env}</div></button>`).join('')}</div>
<div class="card" style="margin-top:12px"><h3>${t.n}</h3><p class="mu sm">Mission environment: ${t.env}</p><div class="grid g2">${t.m.slice(0,5).map(x=>`<div class="sm"><span class="mu">${x[0]}:</span> ${x[1]}</div>`).join('')}</div></div>`}
if(s===2)h+=`<h3>Analysis priorities</h3><div class="grid g4" style="margin:10px 0">${Object.entries(PRE).map(([k,p])=>`<button class="opt ${st.pre===k?'sel':''}" data-a="pre" data-v="${k}"><b>${p.n}</b><div class="mu sm">${p.w.join(' / ')}</div></button>`).join('')}</div>${sliders()}<div id="prev"></div>`;
if(s===3)h+=`<h3>Earth Scan</h3><p class="mu">${MIS[st.mis].n} · ${T[st.tg].n} · ${st.pre==='custom'?'Custom':PRE[st.pre].n} · weights ${st.w.join('/')}</p>${st.scan<0?'<button class="btn" data-a="scan">Scan Earth</button>':`<div style="margin-top:8px">${SC.slice(0,Math.min(st.scan+1,6)).map((x,i)=>`<div class="${i<st.scan||st.scan>=6?'':'mu'}">${i<st.scan||st.scan>=6?'✓':'…'} ${x}</div>`).join('')}</div><div style="margin:10px 0">${bar(Math.min(100,st.scan/6*100))}</div>${st.scan>=6?'<p style="color:var(--ok)"><b>Analysis complete.</b> '+S.length+' candidates ranked.</p>':''}`}`;

(function(){var cv=document.getElementById('gx'),c=cv.getContext('2d'),root=document.documentElement,btn=document.getElementById('theme'),W,H,P=[],R0,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
