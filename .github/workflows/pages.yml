# Publishes the static EarthTwin prototype (web/) to GitHub Pages.
# Enable once: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy static prototype
on:
  push:
    branches: [static-prototype, main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the data files are present and valid JSON
        run: |
          for f in web/data/*.json web/data/results/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
